<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="color-scheme" content="dark">
  <title>Proyección de terror - Halloween</title>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="/css/screen.css">
</head>
<body>
  <div class="bg-layer bg-base"></div>
  <div class="bg-layer bg-vignette"></div>
  <div class="bg-layer bg-fog"></div>
  <div class="bg-layer bg-noise"></div>

  <main class="stage" role="main" aria-live="polite">
    <section id="waiting" class="view" aria-labelledby="waiting-title">
      <div class="view-inner waiting-inner">
        <div class="eyebrow">La oscuridad te está esperando</div>
        <h1 id="waiting-title" class="title title-waiting">Escanea el QR<br>y descubre tu destino</h1>
        <div class="qr-wrap">
          <div id="qr" class="qr" aria-label="Código QR para enviar tu nombre"></div>
        </div>
        <div id="qr-fallback" class="qr-fallback" aria-live="polite"></div>
        <div class="separator"></div>
        <p class="instructions">Escanea y escribe tu nombre</p>
      </div>
    </section>

    <section id="reveal" class="view hidden" aria-labelledby="person">
      <div class="view-inner reveal-inner">
        <div class="eyebrow">Tu destino está escrito</div>
        <div class="separator"></div>
        <h1 id="person" class="title title-reveal">NOMBRE</h1>
        <div id="phrase" class="phrase"></div>
        <div class="separator"></div>
      </div>
    </section>
  </main>

  <div class="hud">
    <div id="connection" class="hud-item hud-connection" aria-live="polite" aria-label="Estado de conexión">Conectando...</div>
    <div id="queue" class="hud-item hud-queue" aria-live="polite"></div>
    <div id="countdown" class="hud-item hud-countdown" aria-live="polite"></div>
  </div>

  <script src="/vendor/qrcode.min.js"></script>
  <script src="/js/screen.js"></script>
</body>
</html>
