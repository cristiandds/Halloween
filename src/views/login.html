<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Acceso privado</title>
<link rel="stylesheet" href="/css/login.css">
</head>
<body>
<main class="card">
<div class="eyebrow">Control del evento</div>
<h1>Acceso privado</h1>
<p>Introduce la contraseña de administrador para abrir la pantalla y el panel.</p>
<form id="login-form">
<label for="password">Contraseña</label>
<input id="password" name="password" type="password" autocomplete="current-password" maxlength="256" required autofocus>
<button id="submit" type="submit">ENTRAR</button>
</form>
<div id="message" class="message" role="alert" aria-live="polite"></div>
<p class="note"><a href="/join">Volver al formulario público</a></p>
</main>
<script src="/js/login.js"></script>
</body>
</html>
