<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Descubre tu destino</title>
<link rel="stylesheet" href="/css/join.css">
</head>
<body><main class="card">
<h1>Descubre tu destino</h1>
<p>Escribe tu nombre y deja que la oscuridad revele tu historia.</p>
<form id="form">
<label for="name">¿Cómo te llamas?</label>
<input id="name" name="name" maxlength="32" minlength="2" autocomplete="given-name" placeholder="Escribe tu nombre..." required>
<button id="send" type="submit">INVOCAR MI DESTINO</button>
</form>
<div id="result" class="result" role="status" aria-live="polite"></div>
<p class="note">Tu nombre podrá aparecer en la pantalla del evento.</p>
</main>
<script src="/js/join.js"></script></body></html>
